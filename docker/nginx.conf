server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Include default mime types and explicitly register wasm
    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
    }

    # Compression for low bandwidth and fast initial load
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/x-javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml;

    # Single Page Application fallback for Flutter Web
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-term caching for immutable hashed static assets
    location ~* \.(?:ico|css|js|gif|jpe?g|png|wasm|otf|ttf|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Disable access logs for healthchecks/favicon to conserve disk I/O
    location = /favicon.png {
        log_not_found off;
        access_log off;
    }
}
