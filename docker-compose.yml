services:
  web:
    image: nginx:alpine
    container_name: nodalis_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./apps/nodalis_app/build/web:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
