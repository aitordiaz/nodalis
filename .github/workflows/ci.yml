name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-analysis:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Bootstrap Workspace Dependencies
        run: flutter pub get

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run Static Analyzer
        run: flutter analyze --fatal-infos

  unit-and-domain-tests:
    name: Domain & Level Format Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Pub Get
        run: flutter pub get

      - name: Run Domain & Format Tests
        run: dart test packages/nodalis_domain packages/nodalis_level_format

  flutter-widget-tests:
    name: Flutter UI & App Widget Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Pub Get
        run: flutter pub get

      - name: Run Flutter Widget Tests
        run: flutter test packages/nodalis_ui apps/nodalis_app

  validate-levels:
    name: Headless Level Content Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Pub Get
        run: flutter pub get

      - name: Run Level Validator CLI
        run: dart run tools/nodalis_cli/bin/nodalis.dart validate-all --dir=levels/
